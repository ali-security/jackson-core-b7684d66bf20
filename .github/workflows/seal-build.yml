name: seal-build

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Only used for its up-to-date cacerts; the build itself runs on JDK 7 below.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      # The published jar was built with JDK 1.7.0_79 (Build-Jdk manifest header).
      # actions/setup-java can no longer resolve Zulu 7, so fetch the same Zulu 7
      # build the Travis JDK 7 leg uses.
      - name: Install Zulu JDK 7
        run: |
          JDK=zulu7.56.0.11-ca-jdk7.0.352-linux_x64
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/jdk7.tar.gz" "https://cdn.azul.com/zulu/bin/$JDK.tar.gz"
          mkdir -p "$RUNNER_TEMP/jdk7"
          tar -xzf "$RUNNER_TEMP/jdk7.tar.gz" -C "$RUNNER_TEMP/jdk7" --strip-components=1
          cp "$JAVA_HOME/jre/lib/security/cacerts" "$RUNNER_TEMP/jdk7/jre/lib/security/cacerts"
          echo "JAVA_HOME=$RUNNER_TEMP/jdk7" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/jdk7/bin" >> "$GITHUB_PATH"
      - name: Install Maven 3.8.8 (last line that runs on Java 7)
        run: |
          for URL in https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.8.8/apache-maven-3.8.8-bin.tar.gz \
                     https://archive.apache.org/dist/maven/maven-3/3.8.8/binaries/apache-maven-3.8.8-bin.tar.gz; do
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/maven.tar.gz" "$URL" && break
          done
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.8.8/bin" >> "$GITHUB_PATH"
      - name: Package (tests run on Travis)
        env:
          MAVEN_OPTS: -Dhttps.protocols=TLSv1.2
        run: mvn -B -V -e -ntp -DskipTests clean package
      - uses: actions/upload-artifact@v4
        with:
          name: jackson-core-jar
          path: target/jackson-core-2.8.11.jar
          if-no-files-found: error
