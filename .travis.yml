language: java
# core streaming still builds on jdk6 and above:
# Sealed build: Travis no longer provisions openjdk6/oraclejdk7, so .travis/seal-setup.sh
# downloads Azul Zulu builds. The JDK 7 leg runs Maven on Zulu 7. The JDK 6 leg keeps
# Maven on the image's JDK 8 (jackson-parent enforces Java >= 1.7 for the build JVM) and
# forks the surefire test JVM on Zulu 6, so the suite still executes on Java 6.
dist: focal

jobs:
  include:
    - jdk: openjdk8
      env: SEAL_JDK=zulu7.56.0.11-ca-jdk7.0.352-linux_x64
    - jdk: openjdk8
      env: SEAL_TEST_JDK=zulu6.22.0.3-jdk6.0.119-linux_x64
    - jdk: openjdk8

before_install: source .travis/seal-setup.sh

install: true

script:
  - mvn -B -V -e -ntp $SEAL_MVN_ARGS test
  - python3 .travis/surefire-summary.py

after_script: bash .travis/wait-for-log.sh
